<style>
/* Layout: encabezado fijo con período y estado de guardado, pestañas por tarea, contenido a ancho de 1200px.
   Tablero = resumen arriba (4 cifras), obras ordenadas de peor a mejor, mapa por bloque, desempeño por DT. */
:root{

  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --card:#192027; --ink:#e5eaef; --ink2:#a9b4bf; --mute:#7a8793; --line:#2c3640; --line2:#232c34;
  --accent:#6aa8ea; --accent-ink:#0d1620; --accent-soft:#1d3347;
  --good:#5cbb85; --good-soft:#1c3427; --warn:#e2ac4c; --warn-soft:#3a2f17; --bad:#ef8070; --bad-soft:#3e2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --card:#192027; --ink:#e5eaef; --ink2:#a9b4bf; --mute:#7a8793; --line:#2c3640; --line2:#232c34;
  --accent:#6aa8ea; --accent-ink:#0d1620; --accent-soft:#1d3347;
  --good:#5cbb85; --good-soft:#1c3427; --warn:#e2ac4c; --warn-soft:#3a2f17; --bad:#ef8070; --bad-soft:#3e2320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin-inline:auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}

input[type=month],input[type=date],input[type=number],input[type=text],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.save{font-family:var(--f-mono);font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.save.ok i{background:var(--good)} .save.err i{background:var(--bad)} .save.saving i{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current=true]{color:var(--ink);border-bottom-color:var(--accent)}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 12px}
section.blk{margin-block:0 30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-block:1px solid var(--line);margin-bottom:28px}
.stat{padding:14px 16px;border-right:1px solid var(--line2);min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}

.bar{position:relative;height:10px;background:var(--line2);border-radius:2px;min-width:90px}

.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

.heat .h{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:4px 2px;text-align:center}
.heat .o{padding:8px 4px 8px 0;font-weight:600;display:flex;align-items:center}

.c.good{background:var(--good-soft);color:var(--good)} .c.warn{background:var(--warn-soft);color:var(--warn)} .c.bad{background:var(--bad-soft);color:var(--bad)} .c.na{background:var(--line2);color:var(--mute)}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:130px 1fr 28px;align-items:center;gap:8px;font-size:12.5px}
.hb .t{height:12px;background:var(--line2);border-radius:2px;position:relative}
.hb .t i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.hb .t i.o{background:var(--bad)}
.list{display:grid;gap:0}
.li{padding:9px 0;border-bottom:1px solid var(--line2);display:grid;gap:2px}
.li:last-child{border-bottom:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:7px 14px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin-block:10px}
.grid-f label{display:grid;gap:3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.grid-f label input,.grid-f label select,.grid-f label textarea{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);width:100%}
.grid-f .wide{grid-column:1/-1}
/* carga semanal */
.ck{min-width:720px}
.ck .bh td{background:var(--accent-soft);font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:6px 10px}
.ck td.w{text-align:center;width:64px;padding:4px}
.cb{width:50px;height:30px;border-radius:3px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-family:var(--f-mono);color:var(--mute)}
.cb.y{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.cb.n{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.cb[disabled]{opacity:.35;cursor:default;background:var(--line2)}
.ck input.obs{width:100%;min-width:140px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.empty{padding:26px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:4px}
.det td{background:var(--card)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.infrow{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.infrow:last-child{border-bottom:0}
@media (max-width:760px){.infrow{grid-template-columns:minmax(0,1fr)}}
.auto{margin:4px 0 6px;padding-left:16px;color:var(--ink2);font-size:13px}
.dest{width:64px;flex:none}
.ig td{vertical-align:middle} .ig input[type=number]{width:70px} .ig input[type=text]{width:100%;min-width:150px}
.ig tr.og td{border-top:2px solid var(--line)}
.tg{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:3px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;min-width:52px}
.tg.si{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.tg.no{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.num-good{color:var(--good);font-weight:600} .num-bad{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<script>
//#LOGIC-START
const ITEMS=[{"n": 1, "b": "PLANIFICACION", "t": "Cumplimiento de Hitos Mensuales", "ins": "CALENDARIO", "fr": "QUINCENAL"}, {"n": 2, "b": "PLANIFICACION", "t": "Gantt actualizado", "ins": "GANTT", "fr": "MENSUAL"}, {"n": 3, "b": "PLANIFICACION", "t": "Planificación y seguimiento semanal (Minuta semanal)", "ins": "ITEMIZADO", "fr": "SEMANAL"}, {"n": 4, "b": "PLANIFICACION", "t": "Detección temprana de desvíos", "ins": "DISCORD / ITEMIZADO", "fr": "EVENTUAL"}, {"n": 5, "b": "PLANIFICACION", "t": "Plan de acción ante desvíos", "ins": "DISCORD", "fr": "EVENTUAL"}, {"n": 6, "b": "COORDINACION", "t": "Coordinación de gremios y contratistas", "ins": "DISCORD", "fr": "SEMANAL"}, {"n": 7, "b": "COORDINACION", "t": "Coordinación de tareas entre rubros", "ins": "ITEMIZADO", "fr": "SEMANAL"}, {"n": 8, "b": "COORDINACION", "t": "Seguimiento de pendientes", "ins": "ITEMIZADO", "fr": "SEMANAL"}, {"n": 9, "b": "COORDINACION", "t": "Resolución / seguimiento de interferencias", "ins": "DISCORD", "fr": "SEMANAL"}, {"n": 10, "b": "DOCUMENTACION", "t": "Gestión doc. Tec. disponible y actualizada APTO OBRA", "ins": "PLANILLA", "fr": "SEMANAL"}, {"n": 11, "b": "DOCUMENTACION", "t": "Actualización de documentación de obra", "ins": "PLANO / REGISTRO", "fr": "SEMANAL"}, {"n": 12, "b": "DOCUMENTACION", "t": "Gestión permisos municipales y administrativos de obra", "ins": "CHECK LIST", "fr": "SEMANAL"}, {"n": 13, "b": "DOCUMENTACION", "t": "Gestión de Documentación técnica", "ins": "PLANO / REGISTRO", "fr": "SEMANAL"}, {"n": 14, "b": "DOCUMENTACION", "t": "Libro de Ordenes de servicio / Nota de Pedido", "ins": "LIBRO", "fr": "SEMANAL"}, {"n": 15, "b": "MATERIALES", "t": "Gestión y cierre de Requerimientos de compras", "ins": "TRELLO", "fr": "SEMANAL"}, {"n": 16, "b": "MATERIALES", "t": "Previsión y pedido de materiales", "ins": "TRELLO", "fr": "SEMANAL"}, {"n": 17, "b": "MATERIALES", "t": "Recepción, Stock y Faltantes de materiales", "ins": "PLANILLA", "fr": "SEMANAL"}, {"n": 18, "b": "MATERIALES", "t": "Control de calidad de materiales (check list, ensayos, etc, s/ corresponda)", "ins": "CHECK LIST", "fr": "SEMANAL"}, {"n": 19, "b": "MATERIALES", "t": "Verificación cómputos de materiales de contratistas", "ins": "PLANILLA", "fr": "SEMANAL"}, {"n": 20, "b": "CALIDAD", "t": "Control de calidad de EJECUCION DE TRABAJOS", "ins": "CHECK LIST", "fr": "SEMANAL"}, {"n": 21, "b": "CALIDAD", "t": "Detección / prevención de retrabajos", "ins": "CHECK LIST", "fr": "SEMANAL"}, {"n": 22, "b": "CALIDAD", "t": "Recepción de trabajos ejecutados", "ins": "ACTA / CHECK LIST", "fr": "SEMANAL"}, {"n": 23, "b": "HyS. Y OBRA", "t": "Layout de obra (Acceso, Descargas, Camineras, Acopio, Bº, etc.)", "ins": "CROQUIS", "fr": "MENSUAL"}, {"n": 24, "b": "HyS. Y OBRA", "t": "Control (EPP, Ord. y Limp., Trab. Altura, Riesgo Elect., Registro desvíos)", "ins": "CHECK LIST/ DISCORD", "fr": "SEMANAL"}, {"n": 25, "b": "ADMINISTRACION", "t": "Medición de Certificados quincenales Contratista", "ins": "PLANILLA", "fr": "QUINCENAL"}, {"n": 26, "b": "ADMINISTRACION", "t": "Gestión de cambios y adicionales", "ins": "PLANILLA", "fr": "EVENTUAL"}, {"n": 27, "b": "ADMINISTRACION", "t": "Medición de certificados Mensuales p/ cliente", "ins": "PLANILLA", "fr": "MENSUAL"}, {"n": 28, "b": "REPORTING", "t": "Informes diarios internos", "ins": "DISCORD", "fr": "DIARIO"}, {"n": 29, "b": "REPORTING", "t": "Informes SEMANAL p/ Cliente", "ins": "INFORME PDF", "fr": "SEMANAL"}, {"n": 30, "b": "REPORTING", "t": "Informe fotográfico y de avance MENSUAL P/ Cliente", "ins": "INFORME PDF", "fr": "MENSUAL"}];
const BLOCKS=[['PLANIFICACION','Planificación'],['COORDINACION','Coordinación'],['DOCUMENTACION','Documentación'],['MATERIALES','Materiales'],['CALIDAD','Calidad'],['HyS. Y OBRA','HyS y obra'],['ADMINISTRACION','Administración'],['REPORTING','Reporting']];
const TIPOS=['Normativo','Técnico','Coordinación interna','Cliente','Proveedores','Condiciones del sitio'];
const ESTADOS=['abierto','en curso','cerrado'];
const PRIOS=['normal','alta','urgente','crítico'];
const IND=[['desvios','Desvíos detectados anticipadamente'],['pendientes','Pendientes cerrados'],['retrabajos','Retrabajos'],['paralizaciones','Paralizaciones evitables']];
function defaultState(){return{v:1,
  cfg:{meta:.8,alerta:.6,w:{PLANIFICACION:.15,COORDINACION:.15,DOCUMENTACION:.15,MATERIALES:.15,CALIDAD:.15,'HyS. Y OBRA':.05,ADMINISTRACION:.10,REPORTING:.10}},
  dts:[{id:'fm',nombre:'Federico Marti'},{id:'fp',nombre:'Federico Periotti'},{id:'sv',nombre:'Sergio Villalba'},{id:'fr',nombre:'Florencia Ruiz'},{id:'nb',nombre:'Nahuel Bejarano'}],
  obras:[{id:'MZ',nombre:'Martínez Zuccardi',dts:['fm'],activa:true},{id:'EF',nombre:'Eglof (EF LP16)',dts:['fp'],activa:true},{id:'TPL',nombre:'Acceso Terminal Panamericana Logística',dts:['sv'],activa:true},{id:'PRC',nombre:'Poviña · San Pablo Country',dts:['fr'],activa:true},{id:'CE',nombre:'Carletto',dts:['fp','nb'],activa:true},{id:'SYB',nombre:'Shopping YB',dts:['fr'],activa:true},{id:'RM-T',nombre:'RM-T (obra finalizada)',dts:[],activa:false}],
  checks:{},inf:{},desvios:[],compras:[],obsDT:{}}}
const pad=n=>String(n).padStart(2,'0');
const isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function weeksOf(per){const [y,m]=per.split('-').map(Number);const out=[];const last=new Date(y,m,0).getDate();for(let d=1;d<=last;d++){const dt=new Date(y,m-1,d);if(dt.getDay()===1){const e=new Date(y,m-1,d+6);out.push({n:isoWeek(dt),label:d+'–'+e.getDate()+(e.getMonth()!==m-1?'/'+(e.getMonth()+1):'')})}}return out}
function prevPer(per){const [y,m]=per.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
const appl=(it,wi)=>it.fr==='QUINCENAL'?wi%2===0:it.fr==='MENSUAL'?wi===0:true;
function score(S,obra,per){
  const ck=(S.checks[obra+'|'+per]||{}).i||{};const W=weeksOf(per);const bl={};
  BLOCKS.forEach(b=>bl[b[0]]={cap:0,ev:0,ok:0,pct:null});
  const wk=W.map(()=>({ev:0,ok:0}));
  ITEMS.forEach(it=>{const row=ck[it.n]||[];W.forEach((_,wi)=>{if(appl(it,wi))bl[it.b].cap++;const v=row[wi];if(v===0||v===1){bl[it.b].ev++;if(v)bl[it.b].ok++;wk[wi].ev++;if(v)wk[wi].ok++}})});
  let sw=0,sp=0,cap=0,ev=0;
  BLOCKS.forEach(([k])=>{const b=bl[k];b.pct=b.ev?b.ok/b.ev:null;cap+=b.cap;ev+=b.ev;if(b.pct!==null){sw+=S.cfg.w[k];sp+=S.cfg.w[k]*b.pct}});
  return{bl,pct:sw?sp/sw:null,carga:cap?Math.min(1,ev/cap):0,wk:wk.map(x=>x.ev?x.ok/x.ev:null),ev}}
const stat=(S,p)=>p==null?'na':p>=S.cfg.meta?'good':p>=S.cfg.alerta?'warn':'bad';
const vencido=d=>d.estado!=='cerrado'&&d.fechaPA&&d.fechaPA<isoToday();
const diasEntre=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function compra(c){const ciclo=c.fin?diasEntre(c.inicio,c.fin):null;const transc=!c.fin&&c.inicio?diasEntre(c.inicio,isoToday()):null;
  const ex=(c.entregados!=null&&c.pedidos)?c.entregados/c.pedidos:null;const ah=(c.pIni&&c.pCompra)?(c.pIni-c.pCompra)/c.pIni:null;return{ciclo,transc,ex,ah}}
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
function dtObras(S,id){return S.obras.filter(o=>o.activa&&o.dts.includes(id))}
function dtStats(S,id,per){
  const os=dtObras(S,id);const sc=os.map(o=>score(S,o.id,per));const pv=os.map(o=>score(S,o.id,prevPer(per)).pct);
  const ind={desvios:0,pendientes:0,retrabajos:0,paralizaciones:0};const ver={};let hasInd=false;
  os.forEach(o=>{IND.forEach(([k])=>{const v=indVal(S,o.id,per,k);if(v.dt!=null){ind[k]+=v.dt;hasInd=true}})});
  IND.forEach(([k])=>{let cur=0,prv=0,has=false,hp=false;os.forEach(o=>{const v=indVal(S,o.id,per,k),q=indVal(S,o.id,prevPer(per),k);if(v.dt!=null){cur+=v.dt;has=true}if(q.dt!=null){prv+=q.dt;hp=true}});ver[k]=has&&hp?verdict(k,cur,prv):'na'});
  const ids=os.map(o=>o.id);const ds=S.desvios.filter(d=>ids.includes(d.obra)&&d.estado!=='cerrado');
  const bl={};BLOCKS.forEach(([k])=>bl[k]=avg(sc.map(s=>s.bl[k].pct)));
  return{os,sc,pct:avg(sc.map(s=>s.pct)),prev:avg(pv),carga:avg(sc.map(s=>s.carga)),ind,ver,hasInd,abiertos:ds.length,venc:ds.filter(vencido).length,bl}}
const OBJ={desvios:'asc',pendientes:'asc',retrabajos:'desc',paralizaciones:'desc'};
const monthOf=d=>(d||'').slice(0,7);
function migrate(X){const D=defaultState();X=Object.assign(D,X);X.obsDT=X.obsDT||{};
  Object.values(X.checks).forEach(c=>{c.i=c.i||{};c.o=c.o||{};c.d=c.d||{}});
  Object.values(X.inf).forEach(x=>{x.txt=x.txt||{};x.ind=x.ind||{};IND.forEach(([k])=>{const v=x.ind[k];if(typeof v==='number')x.ind[k]={dt:v};else if(v===null||v===undefined)delete x.ind[k]})});
  return X}
function indVal(S,obra,per,k){
  const e=(((S.inf[obra+'|'+per]||{}).ind)||{})[k]||{};
  let dt=typeof e.dt==='number'?e.dt:null,total=typeof e.total==='number'?e.total:null,auto=false;
  if(k==='desvios'){const reg=S.desvios.filter(d=>d.obra===obra&&monthOf(d.fecha)===per);
    if(dt==null&&reg.length){dt=reg.filter(d=>d.detecta==='DT').length;auto=true}
    if(total==null&&dt!=null){total=Math.max(reg.length,dt);auto=true}}
  let resp=e.resp||'';
  if(k==='retrabajos'||k==='paralizaciones'){const f=k==='retrabajos'?'retrab':'paral';const mes=S.desvios.filter(d=>d.obra===obra&&monthOf(d.fecha)===per);
    if(mes.some(d=>d[f])){dt=mes.filter(d=>d[f]==='si').length;auto=true}
    if(k==='retrabajos'&&!resp)resp=[...new Set(mes.filter(d=>d.retrab==='si').map(d=>d.resp).filter(Boolean))].join(', ')}
  return{dt,total,res:(dt!=null&&total)?dt/total:null,resp,obs:e.obs||'',auto}}
function verdict(k,cur,prev){if(cur==null||prev==null)return 'na';const d=cur-prev;
  if(OBJ[k]==='asc')return d>0?'good':d<0?'bad':'na';
  return d<0?'good':d>0?'bad':(cur===0?'good':'na')}
function autoObs(S,obra,per,blockKey,dest){const c=S.checks[obra+'|'+per];if(!c)return [];
  const man=(((S.inf[obra+'|'+per]||{}).txt)||{})[blockKey]||{};const txt=(man[dest]||'').toLowerCase();
  return ITEMS.filter(it=>it.b===blockKey&&c.o&&c.o[it.n]&&((c.d&&c.d[it.n])||'dt')===dest).map(it=>c.o[it.n]).filter(t=>!txt.includes(t.toLowerCase()))}
function gaps(S,obra,per){const g=[];const c=S.checks[obra+'|'+per];const sc=score(S,obra,per);
  if(!c||sc.ev===0){g.push('Sin controles cargados');return g}
  if(sc.carga<0.999)g.push('Falta cargar '+Math.round((1-sc.carga)*100)+'% de los controles');
  const sin=ITEMS.filter(it=>(c.i[it.n]||[]).includes(0)&&!(c.o&&c.o[it.n]));if(sin.length)g.push(sin.length+' controles no cumplidos sin observación');
  const inf=S.inf[obra+'|'+per]||{};const hasTxt=Object.values(inf.txt||{}).some(t=>(t.dt||'').trim()||(t.obra||'').trim())||Object.keys(c.o||{}).length>0;
  if(!hasTxt)g.push('Informe del mes vacío');
  const miss=IND.filter(([k])=>indVal(S,obra,per,k).dt==null);if(miss.length)g.push('Indicadores sin cargar: '+miss.map(m=>m[1].split(' ')[0].toLowerCase()).join(', '));
  const rt=indVal(S,obra,per,'retrabajos');if(rt.dt>0&&!rt.resp)g.push('Retrabajos sin responsable');
  const ab=S.desvios.filter(d=>d.obra===obra&&d.estado!=='cerrado');const sp=ab.filter(d=>!d.fechaPA||!d.resp).length;if(sp)g.push(sp+' desvíos abiertos sin fecha de plan o responsable');
  return g}

  else if(a==='oact'){S.obras.find(x=>x.id===t.dataset.id).activa=t.checked;persist();document.getElementById('sum').textContent=`${activas().length} obras activas · ${S.dts.length} DT`}
  else if(a==='export'){const json=JSON.stringify(S,null,1);let ok=false;try{if(dl)await dl.save({filename:'coordinacion-obras-'+isoToday()+'.json',data:json});ok=!!dl}catch(x){}

});

  else if(a==='odest'){const c=ensure(k);c.d=c.d||{};c.d[t.dataset.n]=t.value;persist();refInf()}
  else if(a==='obsdt'){const o=S.obsDT[ui.per]||(S.obsDT[ui.per]={});if(t.value.trim())o[t.dataset.id]=t.value;else delete o[t.dataset.id];persist()}
  else if(a==='indn'||a==='indt'){const o=t.dataset.o,kk=t.dataset.k;const x=ensureInf(o+'|'+ui.per);const e=(x.ind[kk]=x.ind[kk]||{});if(a==='indn')e[t.dataset.f]=num(t.value);else e[t.dataset.f]=t.value.trim();persist();const c=document.getElementById('idyn_'+o+'_'+kk);if(c)c.innerHTML=indDyn(o,kk,ui.per)}
  else if(a==='ind'){ensureInf(k).ind[t.dataset.k]=num(t.value);persist()}
  else if(a==='txt'){const x=ensureInf(k);(x.txt[t.dataset.b]=x.txt[t.dataset.b]||{})[t.dataset.f]=t.value;persist()}
  else if(a==='fdes'){ui.fDes[t.dataset.k]=t.value;render()}
  else if(a==='fcom'){ui.fCom[t.dataset.k]=t.value;render()}
  else if(a==='destado'){const d=S.desvios.find(x=>x.id===t.dataset.id);d.estado=t.value;persist();keep()}
  else if(a==='onombre'){S.obras.find(x=>x.id===t.dataset.id).nombre=t.value;persist()}
  else if(a==='peso'){S.cfg.w[t.dataset.k]=Math.max(0,Number(t.value)||0)/100;persist()}
  else if(a==='meta'){S.cfg[t.dataset.k]=Math.min(100,Math.max(0,Number(t.value)||0))/100;persist()}
  else if(a==='impfile'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.obras)||!j.checks)throw 0;S=Object.assign(defaultState(),j);persist();ui.msg='Copia restaurada.';render()}catch(x){document.getElementById('impMsg').textContent='El archivo no es una copia válida.'}};r.readAsText(f)}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd_=Object.fromEntries(new FormData(f));
  if(f.id==='fdesForm'){const d={id:ui.form.id||uid(),fecha:fd_.fecha,obra:fd_.obra,evento:fd_.evento.trim(),tipo:fd_.tipo,detecta:fd_.detecta,impDias:num(fd_.impDias),plan:fd_.plan.trim(),fechaPA:fd_.fechaPA||null,resp:fd_.resp.trim(),estado:fd_.estado,prio:fd_.prio,retrab:fd_.retrab||'',paral:fd_.paral||''};
    const i=S.desvios.findIndex(x=>x.id===d.id);if(i>=0)S.desvios[i]=Object.assign(S.desvios[i],d);else S.desvios.push(d);}
  else if(f.id==='fcomForm'){const c={id:ui.form.id||uid(),obra:fd_.obra,req:fd_.req.trim(),desc:fd_.desc.trim(),inicio:fd_.inicio,fin:fd_.fin||null,pedidos:num(fd_.pedidos),entregados:num(fd_.entregados),pIni:num(fd_.pIni),pCompra:num(fd_.pCompra),obs:fd_.obs.trim()};
    const i=S.compras.findIndex(x=>x.id===c.id);if(i>=0)S.compras[i]=c;else S.compras.push(c);}
  else return;ui.form=null;persist();render()});

async function boot(){
  setStatus('load');
  try{const c=window.claude;if(c&&c.use){db=await c.use('db');dl=await c.use('downloads')}}catch(e){db=null}
  let loaded=null;
  if(db){try{const s=await db.doc('app/state').get();dbReady=true;if(s.exists&&s.data().json){loaded=JSON.parse(s.data().json);lastAt=s.data().at||0}}catch(e){}}
  if(!loaded){try{const l=localStorage.getItem('co_state');if(l)loaded=JSON.parse(l)}catch(e){}}
  S=migrate(loaded||{});
  const ms=monthsWithData();const now=isoToday().slice(0,7);const cnt={};Object.keys(S.checks).forEach(k=>{const m=k.split('|')[1];cnt[m]=(cnt[m]||0)+1});const good=ms.filter(m=>cnt[m]>=Math.ceil(activas().length/2));ui.per=good.length?good[good.length-1]:(ms.length?ms[ms.length-1]:now);
  const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h;
  ui.obra=(activas()[0]||{}).id||'';
  render();setStatus(db?(dbReady?'ok':'err'):'local');
  if(db&&dbReady){try{db.doc('app/state').onSnapshot(snap=>{if(!snap.exists)return;const d=snap.data();if(!d||!d.json||d.at===lastAt||saveT)return;try{S=migrate(JSON.parse(d.json));lastAt=d.at;keep()}catch(e){}})}catch(e){}}}
boot();
</script>
